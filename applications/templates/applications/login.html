{% load static %}
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σύνδεση - ΔΕΥΑ Δοξάτου</title>
    <!-- Bootstrap 5 CSS & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0284c7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1.25rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: #0284c7;
            color: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }

        .brand-title {
            color: #0f172a;
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: 0.25rem;
        }

        .brand-subtitle {
            color: #64748b;
            font-size: 0.875rem;
        }

        .form-floating > .form-control {
            border-radius: 0.75rem;
            border: 1.5px solid #e2e8f0;
        }

        .form-floating > .form-control:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        .btn-primary-custom {
            background: #0284c7;
            border: none;
            border-radius: 0.75rem;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .btn-primary-custom:hover {
            background: #0369a1;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .footer-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-icon">
                <i class="fa-solid fa-droplet"></i>
            </div>
            <h1 class="brand-title">Δ.Ε.Υ.Α. Δοξάτου</h1>
            <p class="brand-subtitle">Σύστημα Διαχείρισης Αιτημάτων</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger d-flex align-items-center rounded-3 mb-4" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>
                <div style="font-size: 0.875rem;">
                    Λανθασμένο όνομα χρήστη ή συνθηματικό.
                </div>
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-floating mb-3">
                <input type="text" name="username" class="form-control" id="id_username" placeholder="Username" required autofocus>
                <label for="id_username"><i class="fa-regular fa-user me-2"></i>Όνομα Χρήστη</label>
            </div>

            <div class="form-floating mb-4">
                <input type="password" name="password" class="form-control" id="id_password" placeholder="Password" required>
                <label for="id_password"><i class="fa-solid fa-lock me-2"></i>Συνθηματικό</label>
            </div>

            <button type="submit" class="btn btn-primary-custom text-white w-100">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Είσοδος
            </button>
        </form>

        <div class="footer-text">
            © 2026 ΔΕΥΑ Δοξάτου • All rights reserved
        </div>
    </div>

</body>
</html>
